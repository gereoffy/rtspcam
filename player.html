<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rtspcam lejátszó</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#14161a;--panel:#1e2128;--line:#2e333d;--fg:#e6e8ec;--dim:#8b92a0;--acc:#4da3ff;--rec:#35c46a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px;padding:12px;align-items:start}
aside.panel{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
details#filters{margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
details#filters summary{cursor:pointer;color:var(--dim);font-size:13px;user-select:none}
#fbadge{color:var(--acc);font-weight:600}
@media(max-width:960px){main{grid-template-columns:1fr}aside.panel{position:static;max-height:none}#list{max-height:50vh}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 2px}
select,input,button{background:#2a2f39;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
button:hover{border-color:var(--acc);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#list{flex:1;min-height:120px;margin-top:10px;overflow:auto;border-top:1px solid var(--line)}
.day{cursor:pointer;position:sticky;top:0;background:var(--panel);color:var(--dim);font-size:12px;padding:8px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.item{padding:6px 8px;border-radius:6px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline}
.item:hover{background:#262b34}.item.sel{background:#243349;outline:1px solid var(--acc)}
.item .t{font-variant-numeric:tabular-nums;font-weight:600}
.item .c{color:var(--acc)}
.item .a{color:var(--rec);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{width:min(100%,max(400px,calc((100vh - 270px)*var(--ar,1.333))));margin:0 auto}
.wrap{position:relative;background:#000;border-radius:6px;overflow:hidden;width:100%}
video{display:block;width:100%;height:100%;object-fit:contain;transform-origin:0 0;will-change:transform}
.wrap.zoomed{cursor:grab}.wrap.panning{cursor:grabbing}
#zoomind{position:absolute;top:8px;right:8px;background:#000b;color:#fff;padding:2px 10px;border-radius:12px;font-size:12px;pointer-events:none;display:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tl{width:100%;height:90px;display:block;margin-top:10px;border-radius:4px;background:#101216;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.row .grow{flex:1}
#hud{color:var(--dim);font-variant-numeric:tabular-nums}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none;text-align:center;padding:20px}
#tunepanel{display:none;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#191c22}
#tunepanel .tp-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#tunepanel .tp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 16px}
.stage.tuning #inforow{display:none}
#tunepanel{padding:8px 12px !important;margin-top:8px !important}
#tunepanel .tp-head{margin-bottom:2px !important}
#tunepanel #tstats{margin-top:4px !important;font-size:13px !important}
.stage.tuning{width:100%}
.stage.tuning .wrap{width:min(100%,max(400px,calc((100vh - 505px)*var(--ar,1.333))));margin-left:auto;margin-right:auto}
#tunepanel .ctl label{display:flex;justify-content:space-between;color:var(--fg);font:12px ui-monospace,Menlo,monospace;margin:2px 0 0;white-space:nowrap}
#tunepanel .row{margin-top:6px}
#tunepanel details summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:6px}
#tunepanel .ctl label b{color:var(--acc);font-variant-numeric:tabular-nums}
#tunepanel input[type=range]{width:100%;accent-color:var(--acc);padding:0}
#tunepanel small{display:block;color:var(--dim);font-size:11px}
#tunepanel textarea{width:100%;height:64px;margin-top:4px;background:#101216;color:#cfd6e4;border:1px solid var(--line);border-radius:6px;font:11px ui-monospace,Menlo,monospace;padding:6px}
#tunepanel .zone{display:inline-flex;gap:4px;align-items:center;background:#2a2f39;border-radius:10px;padding:1px 4px 1px 10px;font-size:12px;color:var(--dim)}
#tunepanel .zone button{padding:0 6px;border-radius:8px}
.seg{display:inline-flex}.seg button{border-radius:0;margin:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
#tunebtn.on{background:#ffd23f;border-color:#ffd23f;color:#201800}
#modebadge{position:absolute;top:8px;left:8px;padding:2px 10px;border-radius:12px;font-size:12px;pointer-events:none;background:#000b;color:#fff}
#modebadge.tune{background:#ffd23fee;color:#201800;font-weight:600}
#tl.tuning{outline:2px solid #ffd23f}
#sz{width:100%;height:90px;display:block;margin-top:4px;border-radius:4px;background:#101216;cursor:pointer}
#drawz.on{background:#ffd23f;color:#201800;border-color:#ffd23f}
#mute.on{background:var(--acc);color:#04121f;border-color:var(--acc)}
.wrap.drawing{cursor:crosshair}
@media(max-width:1250px){#tunepanel .tp-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){#tunepanel .tp-grid{grid-template-columns:1fr}}
.chk{display:inline-flex;gap:6px;align-items:center;margin:0;color:var(--fg);font-size:14px}
</style>
</head>
<body>
<main>
  <aside class="panel">
    <div class="top"><a href="/live" id="livebtn" title="élőkép: az összes kamera" style="background:#2a2f39;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;text-decoration:none;font-weight:600"><span style="color:#ff3b30">●</span> Élő</a><h1>rtspcam lejátszó</h1><span id="count" style="color:var(--dim)"></span></div>
    <div class="tools">
      <button id="refresh" title="új felvételek betöltése">↻ Frissítés</button>
      <label class="chk" style="color:var(--dim);font-size:12px"><input type="checkbox" id="autorefresh" checked> automatikus (30 mp)</label>
    </div>
    <details id="filters">
      <summary>Szűrők<span id="fbadge"></span></summary>
      <label>Időszak</label><select id="fper" style="width:100%"><option value="1">Utolsó 1 óra</option><option value="24" selected>Utolsó 24 óra</option><option value="168">Utolsó 7 nap</option><option value="0">Minden</option></select>
      <label>Kamera</label><select id="fcam" style="width:100%"><option value="">Mind</option></select>
      <div class="two">
        <div><label>Dátum -tól</label><input type="date" id="fd0"></div>
        <div><label>Dátum -ig</label><input type="date" id="fd1"></div>
        <div><label>Napszak -tól</label><input type="time" id="ft0"></div>
        <div><label>Napszak -ig</label><input type="time" id="ft1"></div>
      </div>
      <div class="row"><label class="chk"><input type="checkbox" id="fmap"> csak térképpel</label><button id="freset" class="grow" style="flex:0">Szűrők törlése</button></div>
    </details>
    <div id="list"></div>
  </aside>
  <section class="panel">
   <div class="stage" id="stage">
    <div class="wrap" id="wrap" style="aspect-ratio:4/3" title="Görgő: nagyítás az egérkurzornál · húzás: mozgatás · dupla kattintás: visszaállítás">
      <div id="zoomind"></div>
      <div id="modebadge"></div>
      <video id="v" playsinline preload="auto" muted></video>
      <canvas id="ov"></canvas>
      <div id="msg">Válassz egy felvételt a listából.</div>
    </div>
    <canvas id="tl"></canvas>
    <div id="szbox" style="display:none">
      <div class="row" style="margin-top:6px;font-size:12px;color:var(--dim)"><span>Kockaméret (.mvvec):</span>
        <select id="szkind"><option value="f">frame_bytes (egész kocka)</option><option value="v">vcl_bytes (csak képi réteg)</option></select>
        <label style="margin:0" title="0 = az egész klip mediánja (rövid felvételekhez, hangoláshoz); több száz = mozgómedián az előző N kockából (hosszú felvételekhez)">medián ablak <input type="number" id="szwin" value="0" min="0" max="2000" style="width:64px"> kocka (0 = egész klip)</label>
        <label style="margin:0" title="a kocka akkor is „mozgásos", ha a mérete ennyiszerese a mediánnak (és nem I-kocka, és nem global_limit-es). 0 = ki. Csak a hangolásban él, a konfigba nem mentődik (a C rögzítő még nem ismeri)">méretarány-küszöb <input type="range" id="szratio" min="0" max="4" step="0.1" value="0" style="width:120px;padding:0"> <b id="szratiov" style="color:var(--acc)">ki</b></label>
        <label style="margin:0">skála <select id="szscale"><option value="3">3×</option><option value="5">5×</option><option value="10" selected>10×</option></select> medián</label>
        <span><b style="color:#5b9bd5">■</b> P-kocka mérete · <b style="color:#ffb000">━</b> medián · <b style="color:#fff">▮</b> I-kocka/kiugró (&gt; 10× medián, skálán kívül)</span></div>
      <canvas id="sz"></canvas>
    </div>
    <div class="row vrow">
      <button id="play" style="min-width:90px">▶ Lejátszás</button>
      <button id="prev" title="előző kocka (←)">◀ kocka</button><button id="next" title="következő kocka (→)">kocka ▶</button>
      <select id="speed" title="sebesség"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
      <button id="mute" title="hang be/ki (M); csak a hanggal rögzített felvételeknek (rtspcam --audio) van hangja">🔇 Néma</button>
      <span class="seg" title="mi alapján látszik az idővonal és a kockák"><button id="recbtn" class="on" title="az idővonal és a kockák a rögzítő által írt .mvmap-ből">Rögzítő (.mvmap)</button><button id="tunebtn" title="a riasztási paraméterek hangolása a .mvvec-ből, csúszkákkal (a .mvmap-et ilyenkor nem használja)">⚙ Hangolás (.mvvec)</button></span>
    </div>
    <div class="row vrow"><span id="hud"></span></div>
    <div id="tunepanel">
      <div class="tp-grid" id="tsliders"></div>
      <div class="row"><button id="drawz" title="húzz egy téglalapot a képen: ezt a területet a rögzítő figyelmen kívül hagyja">▭ Zóna rajzolása</button><span id="zlist"></span><button id="zclear">Zónák törlése</button></div>
      <div id="tstats" style="margin-top:8px;font-size:14px"></div>
      <div class="row"><label style="margin:0;color:var(--dim)">Kamera neve <input type="text" id="tname" size="12"></label><button id="tload">Betöltés</button><button id="tsave" style="background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600">Mentés</button><span id="tmsg" style="color:var(--dim);font-size:12px"></span></div>
      <details><summary>Parancs a rögzítőhöz</summary><textarea id="tcmd" readonly></textarea></details>
    </div>
    <div class="row" id="settings">
      <label class="chk"><input type="checkbox" id="showov" checked> mozgástérkép</label>
      <label class="chk"><input type="checkbox" id="onlybest" checked title="a sárga (zaj) blokkok eltűnnek, csak a narancs és a piros marad"> zaj elrejtése (sárga)</label>
      <select id="ovmode" title="mit rajzoljon a képre: a riasztó kockákat, a mozgásvektorokat (.mvvec; a vonal hossza a vektor hossza, a színe az iránya) vagy mindkettőt"><option value="cells">kockák</option><option value="vec">vektorok</option><option value="both">kockák + vektorok</option></select>
      <label class="chk" title="lejátszáskor magától belenagyít a riasztó (piros) képrészletbe és követi: a piros kockák befoglaló téglalapjának kb. kétszeresét mutatja, simított mozgással. Kézi nagyítás/húzás kikapcsolja."><input type="checkbox" id="autozoom"> autozoom</label>
      <label class="chk" title="a felvétel végén automatikusan elindul ugyanannak a kamerának a következő felvétele"><input type="checkbox" id="auto"> autoplay</label>
    </div>
    <div class="row" id="inforow"><span id="info" style="color:var(--dim);font-size:12px"></span></div>
   </div>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let items = [], shown = [], cur = null;
// /player/<camera>: the camera filter starts on that camera (any other camera, or all of them, can still be chosen there)
// (also /player#<camera>: a hash without '/' is a camera name, a recording id always looks like camera/date/name)
const FIXCAM = (m => m ? decodeURIComponent(m[1]) : (h => h && !h.includes('/') ? h : '')(decodeURIComponent(location.hash.slice(1))))(location.pathname.match(/^\/player\/([^\/]+)/));
if (FIXCAM) document.title = FIXCAM + ' – lejátszó';
// ---- list ---------------------------------------------------------------------
function fillCameras() {
  const keep = $('fcam').value, cams = [...new Set(items.map(i => i.camera).concat(FIXCAM ? [FIXCAM] : []))].sort();
  $('fcam').innerHTML = '<option value="">Mind (' + cams.length + ')</option>' + cams.map(c => `<option>${c}</option>`).join('');
  if (cams.includes(keep)) $('fcam').value = keep;
}
// The page loads only the period it shows (server: /api/list?since=<epoch>), refreshes incrementally (only the recent part is asked again)
// and every 20th automatic refresh (and the manual one) reloads the whole loaded range, which also drops deleted recordings.
let loadedFrom = 0, autoCount = 0, refreshing = false;            // loadedFrom: epoch seconds the items start at, 0 = everything
const perStart = () => { const h = +$('fper').value; return h ? Date.now() / 1000 - h * 3600 : 0; };
async function fetchItems(since) { return (await fetch('/api/list' + (since ? '?since=' + Math.floor(since) : ''))).json(); }
async function ensureRange() {                                    // the period was widened: load the older part too
  const need = perStart();
  if (loadedFrom !== 0 && (need === 0 || need < loadedFrom)) { $('count').textContent = 'betöltés…'; items = await fetchItems(need); loadedFrom = need; fillCameras(); }
}
function fillCameras() {
  const keep = $('fcam').value, cams = [...new Set(items.map(i => i.camera).concat(FIXCAM ? [FIXCAM] : []))].sort();
  $('fcam').innerHTML = '<option value="">Mind (' + cams.length + ')</option>' + cams.map(c => `<option>${c}</option>`).join('');
  if (cams.includes(keep)) $('fcam').value = keep;
}
// reload the file list without disturbing playback, filters, selection or scroll position
async function refreshList(manual) {
  if (refreshing || !items.length && !manual) return;
  refreshing = true; const sc = $('list').scrollTop, before = items.length;
  try {
    if (manual || ++autoCount % 20 === 0) items = await fetchItems(loadedFrom);
    else { const last = items.reduce((m, i) => Math.max(m, i.ts), 0), since = Math.max(loadedFrom, last - 3600);     // an hour back: files that were still being written
      const fresh = await fetchItems(since); items = items.filter(i => i.ts < since).concat(fresh); }
    fillCameras(); applyFilters(); $('list').scrollTop = sc;
    if (manual) $('count').textContent += items.length > before ? ' (+' + (items.length - before) + ' új)' : ' (nincs új)';
  } catch (e) { $('count').textContent = 'a szerver nem érhető el'; }
  refreshing = false;
}
$('refresh').onclick = () => refreshList(true);
setInterval(() => { if ($('autorefresh').checked && !document.hidden) refreshList(false); }, 30000);
// the page address decides where the list starts: /player = all cameras, last hour; /player/<camera> (or #<camera>) = that camera, last 24 hours
// (the camera and period filters are not restored from the previous visit, the other filters are)
const defaultPeriod = () => FIXCAM ? '24' : '1';
async function loadList() {
  $('count').textContent = 'betöltés…';
  $('fper').value = defaultPeriod();
  loadedFrom = perStart(); items = await fetchItems(loadedFrom);
  const hid = location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : '';
  if (hid.includes('/') && loadedFrom && !items.some(i => i.id === hid)) { items = await fetchItems(0); loadedFrom = 0; $('fper').value = '0'; }   // a link to an older recording
  fillCameras();
  restoreFilters(); $('fcam').value = FIXCAM; applyFilters();
  if (hid.includes('/')) { const it = items.find(i => i.id === hid); if (it) select(it, false); }
}
const dayState = {};                                              // date -> collapsed (user's choice); the default is below
function applyFilters() {
  const cam = $('fcam').value, d0 = $('fd0').value, d1 = $('fd1').value, t0 = $('ft0').value, t1 = $('ft1').value, mp = $('fmap').checked, per = $('fper').value, ps = perStart();
  shown = items.filter(i => (!cam || i.camera === cam) && (!ps || i.ts >= ps) && (!d0 || i.date >= d0) && (!d1 || i.date <= d1) && (!mp || i.has_map)
    && (!t0 || i.time.slice(0,5) >= t0) && (!t1 || i.time.slice(0,5) <= t1)).sort((a,b) => b.ts - a.ts);
  const nf = [cam, d0, d1, t0, t1].filter(Boolean).length + (mp ? 1 : 0) + (per !== '0' ? 1 : 0);
  $('fbadge').textContent = nf ? ' · ' + nf + ' aktív' : '';
  // day groups: a click on the date folds it; with a long period (a week or everything) all days but the newest start folded
  const counts = {}; for (const it of shown) counts[it.date] = (counts[it.date] || 0) + 1;
  const newest = shown.length ? shown[0].date : '', foldDefault = per === '0' || +per >= 168;
  const folded = d => (d in dayState ? dayState[d] : foldDefault && d !== newest) && !(cur && cur.date === d);
  let html = '', day = '';
  for (const it of shown) {
    if (it.date !== day) { day = it.date; html += `<div class="day" data-d="${day}">${folded(day) ? '▸' : '▾'} ${day} · ${counts[day]}</div>`; }
    if (folded(day)) continue;
    html += `<div class="item${cur && cur.id === it.id ? ' sel' : ''}" data-id="${it.id}" title="${it.name}"><span class="t">${it.time}</span><span class="c">${it.camera}</span>${it.has_map ? `<span class="a">${it.alarm_s ? '⚑ ' + it.alarm_s.toFixed(0) + ' s' : ''}</span>` : '<span class="a" style="color:var(--dim)">nincs térkép</span>'}</div>`;
  }
  $('list').innerHTML = html || '<div style="color:var(--dim);padding:12px">Nincs találat.' + (per !== '0' ? ' <a href="#" id="showall" style="color:var(--acc)">Minden időszak</a>' : '') + '</div>';
  $('list').querySelectorAll('.item').forEach(e => e.onclick = () => select(items.find(i => i.id === e.dataset.id), true));
  $('list').querySelectorAll('.day').forEach(e => e.onclick = () => { dayState[e.dataset.d] = !folded(e.dataset.d); const sc = $('list').scrollTop; applyFilters(); $('list').scrollTop = sc; });
  const sa = $('showall'); if (sa) sa.onclick = ev => { ev.preventDefault(); $('fper').value = '0'; $('fper').dispatchEvent(new Event('input')); };
  $('count').textContent = shown.length + ' / ' + items.length + ' felvétel';
  try { localStorage.setItem('rc_filters', JSON.stringify({cam, d0, d1, t0, t1, mp, per})); } catch (e) {}
}
function restoreFilters() {
  try { const f = JSON.parse(localStorage.getItem('rc_filters') || '{}');
    $('fd0').value = f.d0 || ''; $('fd1').value = f.d1 || ''; $('ft0').value = f.t0 || ''; $('ft1').value = f.t1 || ''; $('fmap').checked = !!f.mp; } catch (e) {}
}
['fcam','fd0','fd1','ft0','ft1','fmap'].forEach(id => $(id).addEventListener('input', applyFilters));
$('fper').addEventListener('input', async () => { await ensureRange(); applyFilters(); });
$('freset').onclick = async () => { $('fcam').value = FIXCAM; $('fper').value = defaultPeriod(); for (const id of ['fd0','fd1','ft0','ft1']) $(id).value = ''; $('fmap').checked = false; await ensureRange(); applyFilters(); };
// ---- map ----------------------------------------------------------------------
// frames without a score: 1 = key frame, 16 = not analysed (reference too far back, rtspcam --max-ref-dist)
const SKIPF = 1 | 16;
let thr = 1, yTop = 10, metric = [], hdr = null, tms = [], cl = [], bl = [], fl = [], off = [], cnt = [], body = null, bodyDv = null, vdur = 0;
async function loadMap(it) {
  hdr = null; tms = []; body = null;
  if (!it.has_map) return;
  const r = await fetch('/api/map?id=' + encodeURIComponent(it.id));
  if (!r.ok) return;
  const buf = await r.arrayBuffer(), dv = new DataView(buf), hl = dv.getUint32(0, true);
  hdr = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, hl)));
  const base = 4 + hl; body = buf; bodyDv = dv;
  tms = []; cl = []; bl = []; fl = []; off = []; cnt = [];
  for (let p = base; p + 11 <= buf.byteLength;) {
    const n = dv.getUint16(p + 9, true);
    if (p + 11 + 3*n > buf.byteLength) break;
    tms.push(dv.getUint32(p, true)); cl.push(dv.getUint16(p + 4, true)); bl.push(dv.getUint16(p + 6, true));
    fl.push(dv.getUint8(p + 8)); off.push(p + 11); cnt.push(n); p += 11 + 3*n;
  }
  vdur = tms.length ? (tms[tms.length-1] + 40) / 1000 : 0;

  const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); suppressClick = true;
    if (tpreview && tpreview[2] - tpreview[0] > 0.01 && tpreview[3] - tpreview[1] > 0.01) tzones.push(tpreview); tpreview = null; tuneRecompute(1); };
  addEventListener('mousemove', mv); addEventListener('mouseup', up);
});
$('zclear').onclick = () => { tzones = []; tuneRecompute(1); };
// --- config files (configs/<camera>.json, the same ones the recorders read) ---
async function tuneLoadConfig(announce) {
  const name = $('tname').value; if (!name) return;
  try { const c = await (await fetch('/api/tuneconfig?name=' + encodeURIComponent(name))).json(); let n = 0;
    for (const k of Object.keys(TP)) if (c[k] !== undefined) { TP[k] = +c[k]; n++; }
    if (Array.isArray(c.ignore)) { tzones = c.ignore.map(z => z.split(',').map(Number)).filter(z => z.length === 4 && z.every(isFinite)); n++; }
    if (n || announce) $('tmsg').textContent = n ? 'betöltve: configs/' + name + '.json' : 'nincs mentett konfig ehhez a névhez';
    if (vecs) tuneRecompute(1); else tuneUI();
  } catch (e) { $('tmsg').textContent = 'a konfig nem tölthető be'; }
}
$('tload').onclick = () => tuneLoadConfig(true);
$('tname').addEventListener('input', () => tuneUI());
$('tsave').onclick = async () => {
  const name = $('tname').value; if (!name) { $('tmsg').textContent = 'adj meg egy kameranevet'; return; }
  const body = {...TP, ignore: tzones.map(z => z.map(x => +x.toFixed(4)).join(','))};
  try { const r = await fetch('/api/tuneconfig?name=' + encodeURIComponent(name), {method: 'POST', body: JSON.stringify(body)}); $('tmsg').textContent = r.ok ? 'mentve: ' + (await r.json()).saved : 'hiba: ' + await r.text(); }
  catch (e) { $('tmsg').textContent = 'a mentés nem sikerült'; }
};

$('modebadge').textContent = 'rögzítő · .mvmap';

// ---- frame-size chart (from the .mvvec, format 2): per-frame bytes, rolling median of the previous non-I frames, I frames / outliers clipped ----
const sz = $('sz'), sctx = sz.getContext('2d'); let szCache = null;
const SZP = {ratio: 0, scale: 10};
try { SZP.ratio = +localStorage.getItem('rc_szratio') || 0; SZP.scale = +localStorage.getItem('rc_szscale') || 10; } catch (e) {}
const SZ_K = 10;     // the scale top is SZ_K x the median; a frame above it is an I frame / outlier (off the scale, not part of the median)
function szCompute() {
  const kind = $('szkind').value, win = Math.max(0, +$('szwin').value || 0);
  if (szCache && szCache.v === vecs && szCache.kind === kind && szCache.win === win) return szCache;
  const a = kind === 'v' ? vecs.vbytes : vecs.fbytes, N = a.length, med = new Array(N).fill(0), big = new Array(N).fill(false);
  const medOf = arr => { if (!arr.length) return 0; const c = arr.slice().sort((x, y) => x - y); return c[c.length >> 1]; };
  // whole-clip reference: the median of all frames is robust against the few I frames; drop what is far above it and take the median again
  let g = medOf(a); const kept = a.filter(x => x <= SZ_K * g); g = medOf(kept) || g || 1;
  if (win === 0) { for (let i = 0; i < N; i++) { med[i] = g; big[i] = a[i] > SZ_K * g; } }
  else { const ring = [];     // rolling median of the previous `win` non-I frames (for long recordings)
    for (let i = 0; i < N; i++) { const m = ring.length >= 5 ? medOf(ring) : g; med[i] = m; big[i] = a[i] > SZ_K * m;
      if (!big[i]) { ring.push(a[i]); if (ring.length > win) ring.shift(); } } }
  return szCache = {v: vecs, kind, win, a, med, big, g};
}
function drawSizes() {
  const show = !!(vecs && vecs.fbytes && vecs.t.length); $('szbox').style.display = show ? '' : 'none'; if (!show) return;
  fit(sz); const W = sz.width, H = sz.height, dpr = devicePixelRatio || 1; sctx.clearRect(0, 0, W, H);
  const T = dur(); if (!cur || !T) return; const c = szCompute(), N = vecs.t.length, X = t => t / T * W, yTop = c.g * SZP.scale, Y = b => H - Math.min(1, b / yTop) * (H - 8), sm = tuneOn && tA ? tA.sizeMov : null;
  for (let i = 0; i < N; i++) { const x0 = Math.round(X(vecs.t[i] / 1000)), x1 = Math.max(x0 + 1, Math.round(X((i + 1 < N ? vecs.t[i + 1] : vecs.t[i] + 40) / 1000))), y = Math.round(Y(c.a[i]));
    sctx.fillStyle = c.big[i] ? '#c8d4ff' : (sm && sm[i]) ? '#ff6b4d' : '#5b9bd5'; sctx.fillRect(x0, y, x1 - x0, H - y);
    if (c.big[i] || c.a[i] > yTop) { sctx.fillStyle = '#fff'; sctx.fillRect(x0, y, x1 - x0, Math.min(H - y, 3 * dpr)); } }
  sctx.strokeStyle = '#ffb000'; sctx.lineWidth = 1.6 * dpr; sctx.beginPath();
  for (let i = 0; i < N; i++) { const x = X(vecs.t[i] / 1000), y = Y(c.med[i]); i ? sctx.lineTo(x, y) : sctx.moveTo(x, y); } sctx.stroke(); sctx.lineWidth = 1;
  if (SZP.ratio > 0) { sctx.strokeStyle = '#ffd23f'; sctx.setLineDash([5, 4]); sctx.beginPath(); for (let i = 0; i < N; i++) { const x = X(vecs.t[i] / 1000), y = Y(c.med[i] * SZP.ratio); i ? sctx.lineTo(x, y) : sctx.moveTo(x, y); } sctx.stroke(); sctx.setLineDash([]); }
  const i0 = Math.min(N - 1, idxIn(vecs.t, vt())), r = c.med[i0] ? c.a[i0] / c.med[i0] : 0;
  sctx.fillStyle = '#9aa7bd'; sctx.font = `${11 * dpr}px system-ui`;
  sctx.fillText(`skála: 0–${(yTop / 1024).toFixed(1)} KB (${SZP.scale}× medián) · most: ${(c.a[i0] / 1024).toFixed(1)} KB, medián ${(c.med[i0] / 1024).toFixed(1)} KB, arány ${r.toFixed(2)}×${c.big[i0] ? ' (I/kiugró)' : ''}`, 4, 13 * dpr);
  sctx.fillStyle = '#fff'; sctx.fillRect(X(v.currentTime), 0, 2, H);
}
sz.addEventListener('mousedown', e => { const f = e2 => { const r = sz.getBoundingClientRect(); if (cur) v.currentTime = Math.max(0, Math.min(1, (e2.clientX - r.left) / r.width)) * dur(); };
  f(e); const up = () => { removeEventListener('mousemove', f); removeEventListener('mouseup', up); }; addEventListener('mousemove', f); addEventListener('mouseup', up); });
const szUI = () => { $('szratiov').textContent = SZP.ratio > 0 ? SZP.ratio.toFixed(1) + '×' : 'ki'; $('szratio').value = SZP.ratio; $('szscale').value = SZP.scale; };
szUI();
['szkind', 'szwin'].forEach(id => $(id).addEventListener('change', () => { if (tuneOn && vecs) tuneRecompute(2); dirty = true; }));
$('szratio').addEventListener('input', e => { SZP.ratio = +e.target.value; try { localStorage.setItem('rc_szratio', SZP.ratio); } catch (x) {} szUI(); if (tuneOn && vecs) tuneRecompute(2); dirty = true; });
$('szscale').addEventListener('change', e => { SZP.scale = +e.target.value; try { localStorage.setItem('rc_szscale', SZP.scale); } catch (x) {} dirty = true; });
let lastKey = '';
const drawKey = () => v.currentTime.toFixed(3) + '|' + $('showov').checked + $('onlybest').checked + $('ovmode').value;
function drawAll() {
  lastKey = drawKey(); dirty = false;
  // each part on its own: an exception in one drawing function must not stop the loop (the timeline and the picture would freeze)
  for (const f of [followApply, drawOverlay, drawTimeline, drawSizes]) try { f(); } catch (e) { console.error(f.name, e); }
}
function loop() {
  if (dirty || drawKey() !== lastKey || (!v.paused && $('autozoom').checked)) drawAll();       // (playing with autozoom: the view glides, every display frame)
  requestAnimationFrame(loop);
}
['showov', 'onlybest'].forEach(id => $(id).addEventListener('change', () => dirty = true));
try { const m = localStorage.getItem('rc_ovmode'); if (m && [...$('ovmode').options].some(o => o.value === m)) $('ovmode').value = m; } catch (e) {}
$('ovmode').addEventListener('change', () => { try { localStorage.setItem('rc_ovmode', $('ovmode').value); } catch (e) {}
  if ($('ovmode').value !== 'cells' && cur && cur.has_vec && !vecs && !vecLoading) loadVec(cur); dirty = true; });
new ResizeObserver(() => applyZoom()).observe($('wrap'));
loadList().then(loop);
</script>
